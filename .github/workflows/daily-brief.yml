name: 每日设计简报

on:
  schedule:
    - cron: '33 1 * * *'
  workflow_dispatch:

jobs:
  run-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行早间简报
        env:
          TEAMOROUTER_API_KEY: ${{ secrets.TEAMOROUTER_API_KEY }}
          HAOAI_API_KEY: ${{ secrets.HAOAI_API_KEY }}
          QQ_EMAIL: ${{ secrets.QQ_EMAIL }}
          QQ_AUTH_CODE: ${{ secrets.QQ_AUTH_CODE }}
          SEND_TO: ${{ secrets.SEND_TO }}
        run: python run_all.py

      - name: 提交已见列表更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_articles.json
          if git diff --staged --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "更新已见文章列表 [skip ci]"
            git push
          fi
