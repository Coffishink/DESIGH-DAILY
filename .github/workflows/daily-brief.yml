name: 每日设计简报

on:
  schedule:
    # UTC 23:30 = 北京时间 7:30
    # 周日到周四运行，对应北京时间周一到周五早上
    - cron: '0 0 * * 0-4'
  workflow_dispatch:        # 允许你在 GitHub 网页上手动点按钮触发，方便测试

jobs:
  run-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行早间简报
        env:
          TEAMOROUTER_API_KEY: ${{ secrets.TEAMOROUTER_API_KEY }}
          HAOAI_API_KEY: ${{ secrets.HAOAI_API_KEY }}
          QQ_EMAIL: ${{ secrets.QQ_EMAIL }}
          QQ_AUTH_CODE: ${{ secrets.QQ_AUTH_CODE }}
          SEND_TO: ${{ secrets.SEND_TO }}
        run: python run_all.py
